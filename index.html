<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級功課追蹤與大冒險系統</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  
  <style>
    :root {
      --bg: #F0F4F8;
      --card-bg: #FFFFFF;
      --primary: #4318FF;
      --danger: #EE5D50;
      --danger-bg: #FDE8E8;
      --success: #01B574;
      --success-bg: #E6F7F0;
      --warning: #FFB800;
      --warning-bg: #FFF4E5;
      --late: #FF7A00;
      --late-bg: #FFEEDD;
      --text-dark: #1B2559;
      --text-gray: #A3AED0;
      --border: #E9EDF7;
    }

    * { box-sizing: border-box; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text-dark); padding: 20px; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card-bg); padding: 16px 28px; border-radius: 20px;
      margin-bottom: 24px; box-shadow: 0 4px 18px rgba(0,0,0,0.03); flex-wrap: wrap; gap: 15px;
    }
    .header-title { display: flex; align-items: center; gap: 12px; }
    .header-title h1 { font-size: 26px; color: var(--primary); }
    .sync-status {
      font-size: 13px; padding: 6px 12px; border-radius: 20px; font-weight: bold; display: inline-flex; align-items: center; gap: 6px;
    }
    .sync-status.online { background: var(--success-bg); color: var(--success); }
    .sync-status.offline { background: var(--warning-bg); color: var(--warning); }

    .date-picker-box {
      display: flex; align-items: center; gap: 8px; background: #F4F7FE; padding: 8px 14px; border-radius: 14px;
    }
    .date-picker-box label { font-weight: bold; font-size: 14px; color: var(--text-dark); }
    .date-input { border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-weight: bold; font-size: 15px; }

    .nav-btns { display: flex; gap: 10px; flex-wrap: wrap; }
    .nav-btn {
      border: none; padding: 12px 20px; border-radius: 14px; font-size: 15px; font-weight: bold;
      cursor: pointer; transition: all 0.2s; background: #F4F7FE; color: var(--text-dark);
    }
    .nav-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(67,24,255,0.3); }

    .view-panel { display: none; }
    .view-panel.active { display: block; }

    .card { background: var(--card-bg); padding: 24px; border-radius: 20px; box-shadow: 0 4px 18px rgba(0,0,0,0.03); margin-bottom: 20px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .btn { padding: 10px 18px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; font-size: 14px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text-dark); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 650px; }
    th, td { padding: 14px; text-align: center; border-bottom: 1px solid var(--border); font-size: 16px; }
    th { background-color: #FAFCFE; color: var(--text-gray); font-weight: bold; }
    
    /* 作業狀態按鈕樣式 */
    .status-btn {
      padding: 8px 14px; border-radius: 10px; border: none; font-size: 14px; font-weight: bold;
      cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 4px;
    }
    .status-btn.done { background: var(--success-bg); color: var(--success); }
    .status-btn.missing { background: var(--danger-bg); color: var(--danger); }
    .status-btn.late { background: var(--late-bg); color: var(--late); }
    .status-btn.makeup { background: var(--warning-bg); color: #B7791F; }

    .kids-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .student-card {
      background: var(--card-bg); border-radius: 24px; padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 3px solid transparent; transition: all 0.3s;
    }
    .student-card.has-missing { border-color: var(--danger); background: #FFF9F9; }
    .student-card.all-done { border-color: var(--success); background: #F4FBF7; }
    
    .student-header { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
    .student-avatar {
      font-size: 40px; background: #E9EDF7; width: 68px; height: 68px;
      display: flex; align-items: center; justify-content: center; border-radius: 50%; flex-shrink: 0;
    }
    .student-name { font-size: 22px; font-weight: 800; color: var(--text-dark); }
    
    .hw-badge-list { display: flex; flex-direction: column; gap: 10px; }
    .hw-badge {
      padding: 12px 18px; border-radius: 16px; font-size: 16px; font-weight: bold;
      display: flex; align-items: center; justify-content: space-between;
    }
    .hw-badge.missing { background: var(--danger); color: white; box-shadow: 0 4px 12px rgba(238,93,80,0.3); }
    .hw-badge.makeup { background: var(--warning); color: white; }
    .hw-badge.late { background: var(--late); color: white; }
    .all-clear-badge {
      background: var(--success-bg); color: var(--success); padding: 16px; border-radius: 16px;
      font-size: 18px; font-weight: bold; text-align: center;
    }

    /* Modal 彈窗 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: white; border-radius: 20px; padding: 24px; width: 90%; max-width: 600px;
      max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-gray); }

    .record-item {
      padding: 12px; border-radius: 10px; margin-bottom: 8px; font-size: 14px;
      display: flex; justify-content: space-between; align-items: center; background: #FAFCFE; border: 1px solid var(--border);
    }

    .form-control { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 10px; font-size: 16px; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>🚀 班級功課追蹤大冒險</h1>
      <span id="sync-indicator" class="sync-status offline">● 連線中...</span>
    </div>

    <div class="date-picker-box">
      <label>📅 當前選擇日期：</label>
      <input type="date" id="selected-date" class="date-input" onchange="changeDate()">
    </div>

    <div class="nav-btns">
      <button class="nav-btn active" onclick="switchTab('check', event)">📝 每日登記</button>
      <button class="nav-btn" onclick="switchTab('kids', event)">📺 兒童投影大畫面</button>
      <button class="nav-btn" onclick="switchTab('stats', event)">📊 長期累積統計</button>
      <button class="nav-btn" onclick="switchTab('settings', event)">⚙️ 功課與名單設定</button>
    </div>
  </header>

  <!-- 1. 每日登記面板 -->
  <div id="check-panel" class="view-panel active">
    <div class="card">
      <div class="toolbar">
        <h2 id="current-date-title">🗓️ 本日功課繳交勾選表</h2>
        <div style="font-size:13px; color:var(--text-gray);">
          💡 點擊按鈕可切換：<span style="color:var(--success)">✅ 已繳交</span> ➔ <span style="color:var(--danger)">❌ 未繳交</span> ➔ <span style="color:#B7791F">🟡 補交</span> ➔ <span style="color:var(--late)">🟧 遲交</span>
        </div>
      </div>
      <div class="table-responsive">
        <table>
          <thead id="tracker-thead"></thead>
          <tbody id="tracker-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 2. 兒童大畫面投影面板 -->
  <div id="kids-panel" class="view-panel">
    <div class="kids-grid" id="kids-grid-container"></div>
  </div>

  <!-- 3. 長期統計面板 -->
  <div id="stats-panel" class="view-panel">
    <div class="card">
      <div class="toolbar">
        <h2>📊 全班作業狀態與履歷統計</h2>
        <button class="btn btn-outline" onclick="clearHistoryStats()">🧹 重設紀錄</button>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>座號與姓名</th>
              <th>目前未繳交</th>
              <th>已補交</th>
              <th>遲交</th>
              <th>作業個人履歷</th>
            </tr>
          </thead>
          <tbody id="stats-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 4. 名單與作業設定面板 -->
  <div id="settings-panel" class="view-panel">
    <div class="card">
      <h2>📚 1. 設定今日功課項目（以逗點分隔）</h2>
      <div style="display:flex; gap:10px; max-width:600px; margin-top:10px;">
        <input type="text" id="subjects-input" class="form-control" placeholder="輸入作業名稱，用逗點分開">
        <button class="btn btn-primary" onclick="saveSubjects()">儲存功課項目</button>
      </div>
    </div>

    <div class="card">
      <h2>👥 2. 編輯學生名單</h2>
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:10px; margin-bottom:15px; margin-top:10px;">
        <input type="number" id="new-id" class="form-control" placeholder="座號 (例如: 1)">
        <input type="text" id="new-name" class="form-control" placeholder="學生姓名">
        <button class="btn btn-primary" onclick="addStudent()">新增學生</button>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>座號</th>
              <th>姓名</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="settings-students-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 個人履歷彈窗 (Modal) -->
  <div class="modal-overlay" id="history-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-student-title">學生作業履歷明細</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div id="modal-records-body"></div>
      <div style="margin-top: 20px; text-align: right;">
        <button class="btn btn-primary" onclick="copyStudentReport()">📋 複製此學生履歷報告</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForYourProject",
      authDomain: "red-class-hw.firebaseapp.com",
      databaseURL: "https://red-class-hw-default-rtdb.firebaseio.com",
      projectId: "red-class-hw",
      storageBucket: "red-class-hw.appspot.com",
      messagingSenderId: "342631051692",
      appId: "1:342631051692:web:2afad5465748e2d6f60a09"
    };

    const defaultStudents = [
      { id: 1, name: "陳乾樂", avatar: "🐶" }, { id: 2, name: "林軒毅", avatar: "🐱" },
      { id: 3, name: "張絢掄", avatar: "🦁" }, { id: 4, name: "古子昕", avatar: "🐰" },
      { id: 5, name: "林宥旭", avatar: "🐻" }, { id: 6, name: "劉子禔", avatar: "🦊" },
      { id: 7, name: "林哲立", avatar: "🐼" }, { id: 8, name: "劉宜諺", avatar: "🐨" },
      { id: 9, name: "蔡立宸", avatar: "🐯" }, { id: 10, name: "陳宏曄", avatar: "🐮" },
      { id: 11, name: "蔡孟軒", avatar: "🐷" }, { id: 12, name: "張廷翊", avatar: "🐸" },
      { id: 13, name: "謝佳宸", avatar: "🐵" }, { id: 14, name: "林子耘", avatar: "🐔" },
      { id: 15, name: "林方琦", avatar: "🐧" }, { id: 20, name: "曾卉妤", avatar: "🦄" },
      { id: 21, name: "林侑蕾", avatar: "🦉" }, { id: 22, name: "蔡閔晴", avatar: "🐬" },
      { id: 23, name: "鍾蓉美", avatar: "🦋" }, { id: 24, name: "張宸瑄", avatar: "🐝" },
      { id: 25, name: "賴稚庭", avatar: "🐙" }, { id: 26, name: "呂亭臻", avatar: "🦩" },
      { id: 27, name: "呂亮臻", avatar: "🦔" }, { id: 28, name: "陳莠雅", avatar: "🐿️" },
      { id: 29, name: "許芮瑀", avatar: "🦥" }, { id: 30, name: "楊淞晴", avatar: "🦦" },
      { id: 31, name: "邱詠昕", avatar: "🦘" }, { id: 32, name: "甘茲寧", avatar: "🦡" },
      { id: 33, name: "吳品婕", avatar: "🦚" }, { id: 34, name: "王苡菲", avatar: "🦜" },
      { id: 35, name: "林品妍", avatar: "🐢" }, { id: 36, name: "邱楀童", avatar: "🦆" },
      { id: 37, name: "許綵芙", avatar: "🐋" }
    ];

    const avatars = ["🐶","🐱","🦁","🐰","🐻","🦊","🐼","🐨","🐯","🐮","🐷","🐸","🐵","🐔","🐧","🦄","🦉","🐬","🦋","🐝","🐙","🦩","🦔","🐿️","🦥","🦦","🦘","🦡","🦚","🦜","🐢","🦆","🐋"];

    let currentDateStr = new Date().toISOString().split('T')[0];
    let students = [...defaultStudents];
    let subjects = ["國語習作", "數學習作", "英語單字"];
    let historyData = {}; // 格式: { '2026-09-01': { studentId: { subject: 'done'|'missing'|'makeup'|'late' } } }
    let logs = []; // 歷史履歷明細
    let activeStudentForReport = null;
    let dbRef = null;

    function init() {
      document.getElementById('selected-date').value = currentDateStr;
      render();
      setupFirebase(firebaseConfig);
    }

    function setupFirebase(config) {
      if (typeof firebase !== 'undefined' && !firebase.apps.length) {
        firebase.initializeApp(config);
        const db = firebase.database();
        dbRef = db.ref('class_hw_v6');

        dbRef.on('value', (snapshot) => {
          const val = snapshot.val();
          if (val) {
            students = val.students || defaultStudents;
            subjects = val.subjects || ["國語習作", "數學習作", "英語單字"];
            historyData = val.historyData || {};
            logs = val.logs || [];
          } else {
            saveAllToCloud();
          }
          render();
          updateSyncStatus(true);
        }, () => {
          updateSyncStatus(false);
          render();
        });
      }
    }

    function updateSyncStatus(isOnline) {
      const el = document.getElementById('sync-indicator');
      if (isOnline) {
        el.className = "sync-status online";
        el.innerHTML = "● 雲端即時同步中";
      } else {
        el.className = "sync-status offline";
        el.innerHTML = "● 單機暫存模式";
      }
    }

    function saveAllToCloud() {
      if (dbRef) {
        dbRef.set({
          students: students,
          subjects: subjects,
          historyData: historyData,
          logs: logs
        });
      }
    }

    function changeDate() {
      currentDateStr = document.getElementById('selected-date').value;
      render();
    }

    // 狀態切換：done ➔ missing ➔ makeup ➔ late ➔ done
    function cycleStatus(studentId, subject) {
      if (!historyData[currentDateStr]) historyData[currentDateStr] = {};
      if (!historyData[currentDateStr][studentId]) historyData[currentDateStr][studentId] = {};

      const currentStatus = historyData[currentDateStr][studentId][subject] || 'done';
      let nextStatus = 'done';

      if (currentStatus === 'done') nextStatus = 'missing';
      else if (currentStatus === 'missing') nextStatus = 'makeup';
      else if (currentStatus === 'makeup') nextStatus = 'late';
      else if (currentStatus === 'late') nextStatus = 'done';

      historyData[currentDateStr][studentId][subject] = nextStatus;

      // 紀錄到履歷 Log
      const s = students.find(item => item.id === studentId);
      const todayStr = new Date().toISOString().split('T')[0];
      
      logs.unshift({
        studentId: studentId,
        studentName: s.name,
        date: currentDateStr,
        actionDate: todayStr,
        subject: subject,
        status: nextStatus
      });

      saveAllToCloud();
    }

    function switchTab(tabName, evt) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));
      
      if(evt) evt.target.classList.add('active');
      document.getElementById(`${tabName}-panel`).classList.add('active');
    }

    function openStudentHistory(studentId) {
      const s = students.find(item => item.id === studentId);
      activeStudentForReport = s;
      document.getElementById('modal-student-title').innerText = `📋 ${s.id}號 ${s.name} 的作業履歷明細`;
      
      const modalBody = document.getElementById('modal-records-body');
      modalBody.innerHTML = '';

      // 搜尋該學生的所有特別狀態紀錄 (missing, makeup, late)
      let studentLogs = [];
      Object.keys(historyData).forEach(date => {
        const dayData = historyData[date][studentId];
        if (dayData) {
          Object.keys(dayData).forEach(sub => {
            const status = dayData[sub];
            if (status !== 'done') {
              studentLogs.push({ date, subject: sub, status });
            }
          });
        }
      });

      if (studentLogs.length === 0) {
        modalBody.innerHTML = '<div style="text-align:center; color:var(--success); padding:20px; font-weight:bold;">🌟 該生作業表現優良，完全沒有缺交、補交或遲交紀錄！</div>';
      } else {
        studentLogs.sort((a,b) => b.date.localeCompare(a.date));
        studentLogs.forEach(item => {
          let badgeHtml = '';
          if (item.status === 'missing') badgeHtml = '<span style="color:var(--danger); font-weight:bold;">❌ 未繳交</span>';
          else if (item.status === 'makeup') badgeHtml = '<span style="color:#B7791F; font-weight:bold;">🟡 已補交</span>';
          else if (item.status === 'late') badgeHtml = '<span style="color:var(--late); font-weight:bold;">🟧 遲交</span>';

          modalBody.innerHTML += `
            <div class="record-item">
              <div><strong>📅 ${item.date}</strong> — 【${item.subject}】</div>
              <div>${badgeHtml}</div>
            </div>
          `;
        });
      }

      document.getElementById('history-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('history-modal').classList.remove('active');
    }

    function copyStudentReport() {
      if (!activeStudentForReport) return;
      const s = activeStudentForReport;
      let text = `【${s.name}】作業履歷報告：\n`;

      let studentLogs = [];
      Object.keys(historyData).forEach(date => {
        const dayData = historyData[date][s.id];
        if (dayData) {
          Object.keys(dayData).forEach(sub => {
            const status = dayData[sub];
            if (status !== 'done') {
              studentLogs.push({ date, subject: sub, status });
            }
          });
        }
      });

      if (studentLogs.length === 0) {
        text += '🌟 作業表現優良，無缺交紀錄。';
      } else {
        studentLogs.forEach(item => {
          let statusText = item.status === 'missing' ? '未繳交' : item.status === 'makeup' ? '已補交' : '遲交';
          text += `• ${item.date} ${item.subject}：${statusText}\n`;
        });
      }

      navigator.clipboard.writeText(text).then(() => {
        alert("已成功複製學生履歷報告！可直接貼上至 LINE 訊息中。");
      });
    }

    function saveSubjects() {
      const input = document.getElementById('subjects-input').value;
      if (input.trim()) {
        subjects = input.split(/[,，]/).map(s => s.trim()).filter(s => s.length > 0);
        saveAllToCloud();
        alert("功課項目已更新！");
      }
    }

    function addStudent() {
      const id = parseInt(document.getElementById('new-id').value);
      const name = document.getElementById('new-name').value.trim();
      if (id && name) {
        const randAvatar = avatars[Math.floor(Math.random() * avatars.length)];
        students.push({ id, name, avatar: randAvatar });
        students.sort((a,b) => a.id - b.id);
        document.getElementById('new-id').value = '';
        document.getElementById('new-name').value = '';
        saveAllToCloud();
      }
    }

    function removeStudent(id) {
      if(confirm("確定要刪除這位學生嗎？")) {
        students = students.filter(s => s.id !== id);
        saveAllToCloud();
      }
    }

    function clearHistoryStats() {
      if(confirm("確定要清空所有歷史履歷紀錄嗎？")) {
        historyData = {};
        logs = [];
        saveAllToCloud();
      }
    }

    function render() {
      document.getElementById('subjects-input').value = subjects.join(', ');
      document.getElementById('current-date-title').innerText = `🗓️ ${currentDateStr} 功課繳交勾選表`;

      const dayData = historyData[currentDateStr] || {};

      // 1. 登記表頭
      const thead = document.getElementById('tracker-thead');
      let thHtml = `<tr><th style="width: 25%;">座號 / 學生姓名</th>`;
      subjects.forEach(sub => {
        thHtml += `<th>📝 ${sub}</th>`;
      });
      thHtml += `<th>當日狀態</th></tr>`;
      thead.innerHTML = thHtml;

      // 1. 登記表內容
      const tbody = document.getElementById('tracker-tbody');
      tbody.innerHTML = '';
      students.forEach(s => {
        const sData = dayData[s.id] || {};
        let rowHtml = `<tr><td><strong>${s.id}號 ${s.avatar} ${s.name}</strong></td>`;
        let allDone = true;

        subjects.forEach(sub => {
          const status = sData[sub] || 'done';
          if(status === 'missing') allDone = false;

          let btnText = '✅ 已繳交';
          let btnClass = 'done';

          if (status === 'missing') { btnText = '❌ 未繳交'; btnClass = 'missing'; }
          else if (status === 'makeup') { btnText = '🟡 已補交'; btnClass = 'makeup'; }
          else if (status === 'late') { btnText = '🟧 遲交'; btnClass = 'late'; }

          rowHtml += `<td>
            <button class="status-btn ${btnClass}" onclick="cycleStatus(${s.id}, '${sub}')">
              ${btnText}
            </button>
          </td>`;
        });

        rowHtml += `<td>${allDone ? '<span style="color:var(--success); font-weight:bold;">🌟 完全繳清</span>' : '<span style="color:var(--danger); font-weight:bold;">⚠️ 有缺交</span>'}</td></tr>`;
        tbody.innerHTML += rowHtml;
      });

      // 2. 兒童大畫面
      const kidsContainer = document.getElementById('kids-grid-container');
      kidsContainer.innerHTML = '';
      students.forEach(s => {
        const sData = dayData[s.id] || {};
        const missingSubs = subjects.filter(sub => sData[sub] === 'missing');
        const makeupSubs = subjects.filter(sub => sData[sub] === 'makeup');
        const lateSubs = subjects.filter(sub => sData[sub] === 'late');
        const hasIssue = missingSubs.length > 0 || makeupSubs.length > 0 || lateSubs.length > 0;

        let badgesHtml = '';
        missingSubs.forEach(sub => badgesHtml += `<div class="hw-badge missing"><span>📝 ${sub}</span><span>未繳交</span></div>`);
        makeupSubs.forEach(sub => badgesHtml += `<div class="hw-badge makeup"><span>📝 ${sub}</span><span>已補交</span></div>`);
        lateSubs.forEach(sub => badgesHtml += `<div class="hw-badge late"><span>📝 ${sub}</span><span>遲交</span></div>`);

        if (!hasIssue) {
          badgesHtml = `<div class="all-clear-badge">🌟 功課全數完成！讚！</div>`;
        }

        kidsContainer.innerHTML += `
          <div class="student-card ${missingSubs.length > 0 ? 'has-missing' : 'all-done'}">
            <div class="student-header">
              <div class="student-avatar">${s.avatar}</div>
              <div class="student-name">${s.id}號 ${s.name}</div>
            </div>
            <div class="hw-badge-list">${badgesHtml}</div>
          </div>
        `;
      });

      // 3. 長期統計與履歷列表
      const statsTbody = document.getElementById('stats-tbody');
      statsTbody.innerHTML = '';

      students.forEach(s => {
        let missingCnt = 0, makeupCnt = 0, lateCnt = 0;

        Object.keys(historyData).forEach(date => {
          const sDayData = historyData[date][s.id];
          if (sDayData) {
            Object.values(sDayData).forEach(st => {
              if (st === 'missing') missingCnt++;
              if (st === 'makeup') makeupCnt++;
              if (st === 'late') lateCnt++;
            });
          }
        });

        statsTbody.innerHTML += `
          <tr>
            <td><strong>${s.id}號 ${s.avatar} ${s.name}</strong></td>
            <td><strong style="color:var(--danger);">${missingCnt} 次</strong></td>
            <td><strong style="color:#B7791F;">${makeupCnt} 次</strong></td>
            <td><strong style="color:var(--late);">${lateCnt} 次</strong></td>
            <td>
              <button class="btn btn-outline" onclick="openStudentHistory(${s.id})">🔍 檢視作業履歷</button>
            </td>
          </tr>
        `;
      });

      // 4. 設定頁面
      const settingsTbody = document.getElementById('settings-students-tbody');
      settingsTbody.innerHTML = '';
      students.forEach(s => {
        settingsTbody.innerHTML += `
          <tr>
            <td>${s.id}號</td>
            <td>${s.avatar} ${s.name}</td>
            <td><button class="btn btn-danger" onclick="removeStudent(${s.id})">刪除</button></td>
          </tr>
        `;
      });
    }

    init();
  </script>
</body>
</html>
