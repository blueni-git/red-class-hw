<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級功課追蹤與大冒險系統</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  
  <style>
    :root {
      --bg: #F0F4F8;
      --card-bg: #FFFFFF;
      --primary: #4318FF;
      --danger: #EE5D50;
      --danger-bg: #FDE8E8;
      --success: #01B574;
      --success-bg: #E6F7F0;
      --warning: #FFB800;
      --text-dark: #1B2559;
      --text-gray: #A3AED0;
      --border: #E9EDF7;
    }

    * { box-sizing: border-box; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text-dark); padding: 20px; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card-bg); padding: 16px 28px; border-radius: 20px;
      margin-bottom: 24px; box-shadow: 0 4px 18px rgba(0,0,0,0.03); flex-wrap: wrap; gap: 15px;
    }
    .header-title { display: flex; align-items: center; gap: 12px; }
    .header-title h1 { font-size: 26px; color: var(--primary); }
    .sync-status {
      font-size: 13px; padding: 6px 12px; border-radius: 20px; font-weight: bold; display: inline-flex; align-items: center; gap: 6px;
    }
    .sync-status.online { background: var(--success-bg); color: var(--success); }
    .sync-status.offline { background: #FFF4E5; color: var(--warning); }

    .date-picker-box {
      display: flex; align-items: center; gap: 8px; background: #F4F7FE; padding: 8px 14px; border-radius: 14px;
    }
    .date-picker-box label { font-weight: bold; font-size: 14px; color: var(--text-dark); }
    .date-input { border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-weight: bold; font-size: 15px; }

    .nav-btns { display: flex; gap: 10px; flex-wrap: wrap; }
    .nav-btn {
      border: none; padding: 12px 20px; border-radius: 14px; font-size: 15px; font-weight: bold;
      cursor: pointer; transition: all 0.2s; background: #F4F7FE; color: var(--text-dark);
    }
    .nav-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(67,24,255,0.3); }

    .view-panel { display: none; }
    .view-panel.active { display: block; }

    .card { background: var(--card-bg); padding: 24px; border-radius: 20px; box-shadow: 0 4px 18px rgba(0,0,0,0.03); margin-bottom: 20px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .btn { padding: 10px 18px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; font-size: 14px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text-dark); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 650px; }
    th, td { padding: 16px; text-align: center; border-bottom: 1px solid var(--border); font-size: 17px; }
    th { background-color: #FAFCFE; color: var(--text-gray); font-weight: bold; }
    
    .status-toggle {
      padding: 10px 20px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px;
    }
    .status-toggle.done { background: var(--success-bg); color: var(--success); }
    .status-toggle.missing { background: var(--danger-bg); color: var(--danger); }

    .kids-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .student-card {
      background: var(--card-bg); border-radius: 24px; padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 3px solid transparent; transition: all 0.3s;
    }
    .student-card.has-missing { border-color: var(--danger); background: #FFF9F9; }
    .student-card.all-done { border-color: var(--success); background: #F4FBF7; }
    
    .student-header { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
    .student-avatar {
      font-size: 40px; background: #E9EDF7; width: 68px; height: 68px;
      display: flex; align-items: center; justify-content: center; border-radius: 50%; flex-shrink: 0;
    }
    .student-name { font-size: 22px; font-weight: 800; color: var(--text-dark); }
    
    .hw-badge-list { display: flex; flex-direction: column; gap: 10px; }
    .hw-badge {
      padding: 12px 18px; border-radius: 16px; font-size: 18px; font-weight: bold;
      display: flex; align-items: center; justify-content: space-between;
    }
    .hw-badge.missing { background: var(--danger); color: white; box-shadow: 0 4px 12px rgba(238,93,80,0.3); }
    .all-clear-badge {
      background: var(--success-bg); color: var(--success); padding: 16px; border-radius: 16px;
      font-size: 20px; font-weight: bold; text-align: center;
    }

    .stats-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 24px; }
    .stat-card { background: var(--card-bg); padding: 24px; border-radius: 20px; text-align: center; box-shadow: 0 4px 18px rgba(0,0,0,0.03); }
    .stat-card .label { font-size: 16px; color: var(--text-gray); font-weight: bold; }
    .stat-card .value { font-size: 42px; font-weight: 800; color: var(--primary); margin-top: 8px; }
    .stat-card.danger .value { color: var(--danger); }

    .tag-risk { background: var(--danger-bg); color: var(--danger); padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }
    .tag-good { background: var(--success-bg); color: var(--success); padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }

    .log-list { max-height: 250px; overflow-y: auto; background: #FAFCFE; border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    .log-item { font-size: 14px; padding: 6px 0; border-bottom: 1px dashed var(--border); color: #555; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: bold; }
    .form-control { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 10px; font-size: 16px; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>🚀 班級功課追蹤大冒險</h1>
      <span id="sync-indicator" class="sync-status offline">● 連線中...</span>
    </div>

    <div class="date-picker-box">
      <label>📅 當前選擇日期：</label>
      <input type="date" id="selected-date" class="date-input" onchange="changeDate()">
    </div>

    <div class="nav-btns">
      <button class="nav-btn active" onclick="switchTab('check', event)">📝 每日登記</button>
      <button class="nav-btn" onclick="switchTab('kids', event)">📺 兒童投影大畫面</button>
      <button class="nav-btn" onclick="switchTab('stats', event)">📊 長期累積統計</button>
      <button class="nav-btn" onclick="switchTab('settings', event)">⚙️ 功課與名單設定</button>
    </div>
  </header>

  <!-- 1. 每日登記面板 -->
  <div id="check-panel" class="view-panel active">
    <div class="card">
      <div class="toolbar">
        <h2 id="current-date-title">🗓️ 本日功課繳交勾選表</h2>
        <div>
          <button class="btn btn-outline" onclick="resetTodayData()">🔄 重設當日數據</button>
        </div>
      </div>
      <div class="table-responsive">
        <table>
          <thead id="tracker-thead"></thead>
          <tbody id="tracker-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 2. 兒童大畫面投影面板 -->
  <div id="kids-panel" class="view-panel">
    <div class="kids-grid" id="kids-grid-container"></div>
  </div>

  <!-- 3. 長期統計面板 -->
  <div id="stats-panel" class="view-panel">
    <div class="stats-summary">
      <div class="stat-card">
        <div class="label">當日全班繳交率</div>
        <div class="value" id="stats-rate">0%</div>
      </div>
      <div class="stat-card danger">
        <div class="label">當日缺交總人次</div>
        <div class="value" id="stats-missing-count">0</div>
      </div>
      <div class="stat-card">
        <div class="label">當日作業全清人數</div>
        <div class="value" id="stats-clear-students">0 / 0</div>
      </div>
    </div>

    <div class="card">
      <div class="toolbar">
        <h2>⚠️ 歷史未繳交累積統計榜</h2>
        <button class="btn btn-outline" onclick="clearHistoryStats()">🧹 清空累積紀錄</button>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>座號與姓名</th>
              <th>歷史缺交累積人次</th>
              <th>關懷提醒</th>
            </tr>
          </thead>
          <tbody id="stats-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>📜 歷史操作變動紀錄 (Audit Log)</h2>
      <div class="log-list" id="logs-container">
        <div class="log-item">尚無異動紀錄</div>
      </div>
    </div>
  </div>

  <!-- 4. 名單與作業設定面板 -->
  <div id="settings-panel" class="view-panel">
    <div class="card">
      <h2>📚 1. 設定今日功課項目（以逗點分隔）</h2>
      <p style="color:var(--text-gray); margin-bottom:12px;">您可以隨時修改今天的作業名稱，例如：國語習作, 數學習作, 英文單字</p>
      <div style="display:flex; gap:10px; max-width:600px;">
        <input type="text" id="subjects-input" class="form-control" placeholder="輸入作業名稱，用逗點分開">
        <button class="btn btn-primary" onclick="saveSubjects()">儲存功課項目</button>
      </div>
    </div>

    <div class="card">
      <h2>👥 2. 編輯學生名單</h2>
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:10px; margin-bottom:15px;">
        <input type="number" id="new-id" class="form-control" placeholder="座號 (例如: 1)">
        <input type="text" id="new-name" class="form-control" placeholder="學生姓名">
        <button class="btn btn-primary" onclick="addStudent()">新增學生</button>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>座號</th>
              <th>姓名</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="settings-students-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForYourProject",
      authDomain: "red-class-hw.firebaseapp.com",
      databaseURL: "https://red-class-hw-default-rtdb.firebaseio.com",
      projectId: "red-class-hw",
      storageBucket: "red-class-hw.appspot.com",
      messagingSenderId: "342631051692",
      appId: "1:342631051692:web:2afad5465748e2d6f60a09"
    };

    const defaultStudents = [
      { id: 1, name: "陳乾樂", avatar: "🐶", missingHistory: 0 }, { id: 2, name: "林軒毅", avatar: "🐱", missingHistory: 0 },
      { id: 3, name: "張絢掄", avatar: "🦁", missingHistory: 0 }, { id: 4, name: "古子昕", avatar: "🐰", missingHistory: 0 },
      { id: 5, name: "林宥旭", avatar: "🐻", missingHistory: 0 }, { id: 6, name: "劉子禔", avatar: "🦊", missingHistory: 0 },
      { id: 7, name: "林哲立", avatar: "🐼", missingHistory: 0 }, { id: 8, name: "劉宜諺", avatar: "🐨", missingHistory: 0 },
      { id: 9, name: "蔡立宸", avatar: "🐯", missingHistory: 0 }, { id: 10, name: "陳宏曄", avatar: "🐮", missingHistory: 0 },
      { id: 11, name: "蔡孟軒", avatar: "🐷", missingHistory: 0 }, { id: 12, name: "張廷翊", avatar: "🐸", missingHistory: 0 },
      { id: 13, name: "謝佳宸", avatar: "🐵", missingHistory: 0 }, { id: 14, name: "林子耘", avatar: "🐔", missingHistory: 0 },
      { id: 15, name: "林方琦", avatar: "🐧", missingHistory: 0 }, { id: 20, name: "曾卉妤", avatar: "🦄", missingHistory: 0 },
      { id: 21, name: "林侑蕾", avatar: "🦉", missingHistory: 0 }, { id: 22, name: "蔡閔晴", avatar: "🐬", missingHistory: 0 },
      { id: 23, name: "鍾蓉美", avatar: "🦋", missingHistory: 0 }, { id: 24, name: "張宸瑄", avatar: "🐝", missingHistory: 0 },
      { id: 25, name: "賴稚庭", avatar: "🐙", missingHistory: 0 }, { id: 26, name: "呂亭臻", avatar: "🦩", missingHistory: 0 },
      { id: 27, name: "呂亮臻", avatar: "🦔", missingHistory: 0 }, { id: 28, name: "陳莠雅", avatar: "🐿️", missingHistory: 0 },
      { id: 29, name: "許芮瑀", avatar: "🦥", missingHistory: 0 }, { id: 30, name: "楊淞晴", avatar: "🦦", missingHistory: 0 },
      { id: 31, name: "邱詠昕", avatar: "🦘", missingHistory: 0 }, { id: 32, name: "甘茲寧", avatar: "🦡", missingHistory: 0 },
      { id: 33, name: "吳品婕", avatar: "🦚", missingHistory: 0 }, { id: 34, name: "王苡菲", avatar: "🦜", missingHistory: 0 },
      { id: 35, name: "林品妍", avatar: "🐢", missingHistory: 0 }, { id: 36, name: "邱楀童", avatar: "🦆", missingHistory: 0 },
      { id: 37, name: "許綵芙", avatar: "🐋", missingHistory: 0 }
    ];

    const avatars = ["🐶","🐱","🦁","🐰","🐻","🦊","🐼","🐨","🐯","🐮","🐷","🐸","🐵","🐔","🐧","🦄","🦉","🐬","🦋","🐝","🐙","🦩","🦔","🐿️","🦥","🦦","🦘","🦡","🦚","🦜","🐢","🦆","🐋"];

    let currentDateStr = new Date().toISOString().split('T')[0];
    let students = [...defaultStudents];
    let subjects = ["國語習作", "數學習作", "英語單字"];
    let historyData = {}; // 按日期儲存 dailyData
    let logs = [];
    let dbRef = null;

    function init() {
      document.getElementById('selected-date').value = currentDateStr;
      render();
      setupFirebase(firebaseConfig);
    }

    function setupFirebase(config) {
      if (typeof firebase !== 'undefined' && !firebase.apps.length) {
        firebase.initializeApp(config);
        const db = firebase.database();
        dbRef = db.ref('class_hw_v5');

        dbRef.on('value', (snapshot) => {
          const val = snapshot.val();
          if (val) {
            students = val.students || defaultStudents;
            subjects = val.subjects || ["國語習作", "數學習作", "英語單字"];
            historyData = val.historyData || {};
            logs = val.logs || [];
          } else {
            saveAllToCloud();
          }
          render();
          updateSyncStatus(true);
        }, () => {
          updateSyncStatus(false);
          render();
        });
      }
    }

    function updateSyncStatus(isOnline) {
      const el = document.getElementById('sync-indicator');
      if (isOnline) {
        el.className = "sync-status online";
        el.innerHTML = "● 雲端即時同步中";
      } else {
        el.className = "sync-status offline";
        el.innerHTML = "● 單機暫存模式";
      }
    }

    function saveAllToCloud() {
      if (dbRef) {
        dbRef.set({
          students: students,
          subjects: subjects,
          historyData: historyData,
          logs: logs
        });
      }
    }

    function changeDate() {
      currentDateStr = document.getElementById('selected-date').value;
      render();
    }

    function toggleStatus(studentId, subject) {
      if (!historyData[currentDateStr]) historyData[currentDateStr] = {};
      const dayData = historyData[currentDateStr];
      if (!dayData[studentId]) dayData[studentId] = {};

      const wasDone = dayData[studentId][subject] !== false; // 原本是否完成
      dayData[studentId][subject] = !wasDone;

      const s = students.find(item => item.id === studentId);

      if (wasDone) {
        s.missingHistory = (s.missingHistory || 0) + 1;
        addLog(`[${currentDateStr}] ${s.name}：【${subject}】登記為【未繳交】`);
      } else {
        s.missingHistory = Math.max(0, (s.missingHistory || 0) - 1);
        addLog(`[${currentDateStr}] ${s.name}：【${subject}】改回為【已繳交】`);
      }

      saveAllToCloud();
    }

    function addLog(msg) {
      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
      logs.unshift(`${timeStr} - ${msg}`);
      if (logs.length > 50) logs.pop();
    }

    function resetTodayData() {
      if(confirm(`確定要重設 ${currentDateStr} 當天的繳交狀況嗎？`)) {
        historyData[currentDateStr] = {};
        addLog(`[${currentDateStr}] 重設當日數據`);
        saveAllToCloud();
      }
    }

    function clearHistoryStats() {
      if(confirm("確定要將全班的「歷史缺交累積人次」歸零嗎？")) {
        students.forEach(s => s.missingHistory = 0);
        addLog(`清空全班歷史缺交統計人次`);
        saveAllToCloud();
      }
    }

    function saveSubjects() {
      const input = document.getElementById('subjects-input').value;
      if (input.trim()) {
        subjects = input.split(/[,，]/).map(s => s.trim()).filter(s => s.length > 0);
        saveAllToCloud();
        alert("功課項目已更新！");
      }
    }

    function addStudent() {
      const id = parseInt(document.getElementById('new-id').value);
      const name = document.getElementById('new-name').value.trim();
      if (id && name) {
        const randAvatar = avatars[Math.floor(Math.random() * avatars.length)];
        students.push({ id, name, avatar: randAvatar, missingHistory: 0 });
        students.sort((a,b) => a.id - b.id);
        document.getElementById('new-id').value = '';
        document.getElementById('new-name').value = '';
        saveAllToCloud();
      }
    }

    function removeStudent(id) {
      if(confirm("確定要刪除這位學生嗎？")) {
        students = students.filter(s => s.id !== id);
        saveAllToCloud();
      }
    }

    function switchTab(tabName, evt) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));
      
      if(evt) evt.target.classList.add('active');
      document.getElementById(`${tabName}-panel`).classList.add('active');
    }

    function render() {
      document.getElementById('subjects-input').value = subjects.join(', ');
      document.getElementById('current-date-title').innerText = `🗓️ ${currentDateStr} 功課繳交勾選表`;

      const dayData = historyData[currentDateStr] || {};

      // 1. 登記表表頭
      const thead = document.getElementById('tracker-thead');
      let thHtml = `<tr><th style="width: 25%;">座號 / 學生姓名</th>`;
      subjects.forEach(sub => {
        thHtml += `<th>📝 ${sub}</th>`;
      });
      thHtml += `<th>當日狀態</th></tr>`;
      thead.innerHTML = thHtml;

      // 1. 登記表內容
      const tbody = document.getElementById('tracker-tbody');
      tbody.innerHTML = '';
      students.forEach(s => {
        const sData = dayData[s.id] || {};
        let rowHtml = `<tr><td><strong>${s.id}號 ${s.avatar} ${s.name}</strong></td>`;
        let allDone = true;

        subjects.forEach(sub => {
          const isDone = sData[sub] !== false;
          if(!isDone) allDone = false;
          rowHtml += `<td>
            <button class="status-toggle ${isDone ? 'done' : 'missing'}" onclick="toggleStatus(${s.id}, '${sub}')">
              ${isDone ? '✅ 已繳交' : '❌ 未繳交'}
            </button>
          </td>`;
        });

        rowHtml += `<td>${allDone ? '<span style="color:var(--success); font-weight:bold;">🌟 完全繳清</span>' : '<span style="color:var(--danger); font-weight:bold;">⚠️ 缺交中</span>'}</td></tr>`;
        tbody.innerHTML += rowHtml;
      });

      // 2. 兒童大畫面
      const kidsContainer = document.getElementById('kids-grid-container');
      kidsContainer.innerHTML = '';
      students.forEach(s => {
        const sData = dayData[s.id] || {};
        const missingSubjects = subjects.filter(sub => sData[sub] === false);
        const hasMissing = missingSubjects.length > 0;

        let badgesHtml = '';
        if (hasMissing) {
          missingSubjects.forEach(sub => {
            badgesHtml += `
              <div class="hw-badge missing">
                <span>📝 ${sub}</span>
                <span>未繳交</span>
              </div>`;
          });
        } else {
          badgesHtml = `<div class="all-clear-badge">🌟 功課全數完成！讚！</div>`;
        }

        kidsContainer.innerHTML += `
          <div class="student-card ${hasMissing ? 'has-missing' : 'all-done'}">
            <div class="student-header">
              <div class="student-avatar">${s.avatar}</div>
              <div class="student-name">${s.id}號 ${s.name}</div>
            </div>
            <div class="hw-badge-list">${badgesHtml}</div>
          </div>
        `;
      });

      // 3. 統計面板
      let totalTasks = students.length * subjects.length;
      let completedTasks = 0;
      let missingCount = 0;
      let clearStudentsCount = 0;

      students.forEach(s => {
        const sData = dayData[s.id] || {};
        let sMissing = 0;
        subjects.forEach(sub => {
          if (sData[sub] !== false) completedTasks++;
          else { missingCount++; sMissing++; }
        });
        if (sMissing === 0) clearStudentsCount++;
      });

      const rate = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 100;
      document.getElementById('stats-rate').innerText = `${rate}%`;
      document.getElementById('stats-missing-count').innerText = missingCount;
      document.getElementById('stats-clear-students').innerText = `${clearStudentsCount} / ${students.length}`;

      // 歷史缺交統計列表
      const statsTbody = document.getElementById('stats-tbody');
      statsTbody.innerHTML = '';
      const sortedStudents = [...students].sort((a,b) => (b.missingHistory || 0) - (a.missingHistory || 0));
      
      sortedStudents.forEach(s => {
        const count = s.missingHistory || 0;
        let tagHtml = '<span class="tag-good">👍 狀況良好</span>';
        if (count >= 5) tagHtml = '<span class="tag-risk">⚠️ 加強關懷</span>';
        else if (count >= 1) tagHtml = '<span style="background:#FFF4E5; color:var(--warning); padding:6px 12px; border-radius:20px; font-weight:bold; font-size:14px;">⚡ 需留意</span>';

        statsTbody.innerHTML += `
          <tr>
            <td><strong>${s.id}號 ${s.avatar} ${s.name}</strong></td>
            <td><strong style="font-size:18px; color:${count > 0 ? 'var(--danger)' : 'var(--text-dark)'};">${count} 次</strong></td>
            <td>${tagHtml}</td>
          </tr>
        `;
      });

      // 渲染操作日誌
      const logsContainer = document.getElementById('logs-container');
      if (logs.length === 0) {
        logsContainer.innerHTML = '<div class="log-item">尚無異動紀錄</div>';
      } else {
        logsContainer.innerHTML = logs.map(l => `<div class="log-item">${l}</div>`).join('');
      }

      // 4. 設定頁面學生列表
      const settingsTbody = document.getElementById('settings-students-tbody');
      settingsTbody.innerHTML = '';
      students.forEach(s => {
        settingsTbody.innerHTML += `
          <tr>
            <td>${s.id}號</td>
            <td>${s.avatar} ${s.name}</td>
            <td><button class="btn btn-danger" onclick="removeStudent(${s.id})">刪除</button></td>
          </tr>
        `;
      });
    }

    init();
  </script>
</body>
</html>
